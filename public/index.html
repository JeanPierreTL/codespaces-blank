<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casco inteligente de ciclista con RA</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <script src="js/casco.js"></script>
  <script src="js/libro.js" defer></script>
</head>
<body>
  <section id="panel" aria-label="Controles del libro">
    <label for="pagina">Página del libro</label>
    <select id="pagina">
      <option value="1">1 El casco</option>
      <option value="2">2 Sensor de movimiento</option>
      <option value="3">3 Luces direccionales</option>
      <option value="4">4 Inclinación y giro</option>
      <option value="5">5 El sistema completo</option>
    </select>

    <p id="contenido"></p>

    <label for="inclinacion">Inclinación: <span id="valorAngulo">0</span>° (− izquierda / + derecha)</label>
    <input id="inclinacion" type="range" min="-45" max="45" value="0" disabled>

    <button id="pausa" type="button">Pausar</button>
    <p id="estado" role="status">Permite la cámara y enfoca Hiro.</p>

    <div id="controlCamara">
      <label for="camara">Cámara del teléfono</label>
      <select id="camara" disabled>
        <option>Detectando cámaras…</option>
      </select>
      <small>Si la imagen se ve ampliada o borrosa, selecciona otra cámara trasera.</small>
      <small><a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png"
        target="_blank" rel="noopener">Abrir el marcador Hiro correcto</a></small>
    </div>

    <small>Modelo didáctico: simula el comportamiento del casco real.</small>
  </section>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: false; precision: medium; maxCanvasWidth: 720; maxCanvasHeight: 1280"
    arjs="sourceType: webcam;
      debugUIEnabled: false;
      trackingMethod: artoolkit;
      detectionMode: mono;
      sourceWidth: 960; sourceHeight: 720;
      displayWidth: 960; displayHeight: 720;
      canvasWidth: 480; canvasHeight: 360;
      maxDetectionRate: 20">

  <a-marker id="marcador" preset="hiro" emitevents="true">

    <!-- Objeto de prueba: debe aparecer al detectar Hiro -->
    <a-box
      id="pruebaAR"
      position="0 0.15 0"
      width="0.2"
      height="0.2"
      depth="0.2"
      material="shader: flat; color: red">
    </a-box>

    <!-- Tu casco original -->
    <a-entity
      id="sistema"
      casco-ciclista
      position="0 0.35 0"
      scale="0.8 0.8 0.8">
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
